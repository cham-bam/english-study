<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>상식과 영어 학습 대시보드</title>
<link rel="stylesheet" href="./assets/dashboard.css?v=20260426-2">
</head>
<body>
<div class="memo-panel" id="memo-panel">
  <button class="memo-head" type="button" id="memo-toggle" aria-expanded="false">
    <span>메모</span>
    <span id="memo-count"></span>
    <span class="memo-arrow" id="memo-arrow">열기</span>
  </button>
  <div class="memo-body" id="memo-body">
    <div id="memo-list"></div>
    <div class="memo-new">
      <textarea id="memo-input" placeholder="새 메모"></textarea>
      <button type="button" id="memo-save">저장</button>
    </div>
  </div>
</div>

<div class="auth-overlay" id="auth-overlay" aria-hidden="true">
  <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="auth-title" id="auth-title">비밀번호 확인</div>
    <div class="auth-desc">대시보드에 접근하려면 비밀번호를 입력하세요.</div>
    <input type="password" class="auth-input" id="auth-input" placeholder="비밀번호" autocomplete="current-password">
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-actions">
      <button class="auth-btn secondary" type="button" id="auth-cancel">취소</button>
      <button class="auth-btn primary" type="button" id="auth-submit">확인</button>
    </div>
  </div>
</div>

<header class="app-header">
  <div>
    <p class="eyebrow">Daily Study</p>
    <h1>상식과 영어</h1>
    <div class="date" id="today-date"></div>
  </div>
  <div class="streak-badge" id="streak-badge">0일</div>
</header>

<div class="container">
  <nav class="tabs" aria-label="대시보드 섹션">
    <button class="tab active" type="button" data-view="today">오늘</button>
    <button class="tab" type="button" data-view="english">영어</button>
    <button class="tab" type="button" data-view="knowledge">상식</button>
  </nav>

  <main id="app">
    <div class="loading">데이터 불러오는 중...</div>
  </main>
</div>

<script src="./assets/dashboard.js?v=20260426-2"></script>
</body>
</html>
