name: Daily study update

on:
  schedule:
    # 20:55 UTC = 05:55 KST
    - cron: "55 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-study-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update daily JSON
        id: update
        run: node tools/update-daily-study.js

      - name: Commit and push changes
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/knowledge.json data/english_daily.json data/speaking_articles.json data/care_daily.json
          git commit -m "Add daily study content for ${{ steps.update.outputs.study_date }}"
          git push

      - name: No changes
        if: steps.update.outputs.changed != 'true'
        run: echo "No daily study changes to commit."
